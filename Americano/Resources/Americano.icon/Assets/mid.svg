<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cupGrad" x1="0" y1="360" x2="0" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4E7CE"/>
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0" y1="650" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#EFD3A4"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="686" y1="448" x2="838" y2="632" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBD6B4"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="363" x2="0" y2="461" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8EDDA"/>
      <stop offset="100%" stop-color="#E0C89E"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="470" y1="0" x2="722" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#925A26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#925A26" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="sideLight" x1="340" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseShade" x1="0" y1="590" x2="0" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#925A26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#925A26" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M 302 412 C 307 532, 338 626, 378 666 C 432 708, 592 708, 646 666 C 686 626, 717 532, 722 412 Z"/>
    </clipPath>
  </defs>
  <!-- saucer -->
  <ellipse cx="512" cy="730" rx="315" ry="64" fill="url(#saucerGrad)"/>
  <ellipse cx="512" cy="720" rx="175" ry="34" fill="#E8CFA2"/>
  <!-- contact shadow under cup -->
  <ellipse cx="512" cy="700" rx="175" ry="32" fill="#783C14" opacity="0.16"/>
  <!-- handle -->
  <ellipse cx="762" cy="540" rx="76" ry="92" fill="none" stroke="url(#handleGrad)" stroke-width="46"/>
  <!-- cup body -->
  <path d="M 302 412 C 307 532, 338 626, 378 666 C 432 708, 592 708, 646 666 C 686 626, 717 532, 722 412 Z" fill="url(#cupGrad)"/>
  <!-- body shading -->
  <g clip-path="url(#bodyClip)">
    <rect x="302" y="400" width="260" height="320" fill="url(#sideLight)"/>
    <rect x="460" y="400" width="262" height="320" fill="url(#sideShade)"/>
    <rect x="302" y="580" width="420" height="130" fill="url(#baseShade)"/>
  </g>
  <!-- rim and inner wall -->
  <ellipse cx="512" cy="412" rx="212" ry="57" fill="#FEFBF4"/>
  <ellipse cx="512" cy="412" rx="190" ry="49" fill="url(#wallGrad)"/>
  <!-- rim top specular -->
  <path d="M 306 402 A 212 57 0 0 1 718 402" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
</svg>
